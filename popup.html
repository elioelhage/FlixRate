<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FlixRate</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header class="brand">
      <div class="logo-wrap" aria-hidden="true">
        <img src="icons/icon128.png" alt="" class="logo" />
      </div>
      <div>
        <h1>FlixRate</h1>
        <p>IMDb episode ratings on Netflix</p>
      </div>
    </header>

    <section class="status-card">
      <div>
        <span class="status-title">FlixRate</span>
        <span id="statusText" class="status-text">Enabled</span>
      </div>
      <button id="toggle" class="toggle" type="button" role="switch" aria-checked="true" aria-label="Toggle FlixRate">
        <span class="toggle-knob"></span>
      </button>
    </section>

    <section class="episode-card">
      <div class="episode-heading">
        <span class="section-label">CURRENT EPISODE</span>
      </div>
      <div id="currentEpisode" class="episode-title">Detecting episode…</div>
      <div id="currentState" class="episode-meta">Start playback on Netflix.</div>
      <div id="ratingStar" class="rating-star rating-star--unrated" aria-label="Rating state">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.85 5.78 6.38.93-4.62 4.5 1.09 6.35L12 17.16l-5.7 3 1.09-6.35-4.62-4.5 6.38-.93L12 2.6z"/></svg>
      </div>
    </section>

    <footer>Version 1.52</footer>
  </main>
  <script src="ratings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
