<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FlixRate</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header class="brand">
      <div class="logo-wrap" aria-hidden="true">
        <img src="icons/icon128.png" alt="" class="logo" />
      </div>
      <div>
        <h1>FlixRate</h1>
        <p>IMDb episode ratings on Netflix</p>
      </div>
    </header>

    <section class="status-card">
      <div>
        <span class="status-title">FlixRate</span>
        <span id="statusText" class="status-text">Enabled</span>
      </div>
      <button id="toggle" class="toggle" type="button" role="switch" aria-checked="true" aria-label="Toggle FlixRate">
        <span class="toggle-knob"></span>
      </button>
    </section>

    <section class="legend">
      <h2>Rating guide</h2>
      <p class="legend-intro">The star next to the volume control changes color to match the episode you're watching.</p>
      <ul id="legendList" class="legend-list"></ul>
      <div class="legend-item legend-item--unrated">
        <span class="swatch swatch--unrated"></span>
        <div class="legend-copy">
          <span class="legend-label">Not enough ratings</span>
          <span class="legend-range">Fewer than 400 IMDb votes, or no data found</span>
        </div>
      </div>
    </section>

    <footer>Version 1.4 · Ratings via OMDb</footer>
  </main>
  <script src="ratings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
